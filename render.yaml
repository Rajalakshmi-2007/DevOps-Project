# Render Blueprint: New > Blueprint > pick this repo.
# Deploys are triggered by the GitHub Actions workflow (deploy hook), not on every push.
services:
  - type: web
    name: smart-campus-cmms
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false          # you will be asked for this during setup (only you know it)
      - key: ADMIN_PASSWORD
        sync: false          # you will be asked for this during setup (min 10 characters)

databases:
  - name: campus-db
    plan: free
    databaseName: campus
    user: campus
